<svg xmlns="http://www.w3.org/2000/svg" width="742" height="606" viewBox="255 335 742 606" role="img" aria-label="Гранёный тёмно-серый бриллиант">
  <defs>
    <path id="gem-outline" d="M422 338 H830 C843 338 852 345 860 356 L981 501 C991 513 995 524 995 537 C995 546 991 556 984 564 L649 930 C643 936 635 939 626 939 C616 939 607 935 601 928 L272 565 C263 555 258 545 258 535 C258 523 261 514 269 505 L397 353 C406 343 413 338 422 338 Z"/>
    <clipPath id="clip-diamond"><use href="#gem-outline"/></clipPath>
    <linearGradient id="upper-left" x1="0" y1="0" x2="0.85" y2="1" objectBoundingBox="true">
      <stop offset="0" stop-color="#c2c6cd"/>
      <stop offset="0.5" stop-color="#a5aab4"/>
      <stop offset="1" stop-color="#9299a4"/>
    </linearGradient>
    <linearGradient id="upper-center" x1="0" y1="0" x2="0.22" y2="1">
      <stop offset="0" stop-color="#e0e4e8"/>
      <stop offset="0.47" stop-color="#d9dde2"/>
      <stop offset="1" stop-color="#c9ced5"/>
    </linearGradient>
    <linearGradient id="upper-right" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#b3b9c2"/>
      <stop offset="0.55" stop-color="#a4aab5"/>
      <stop offset="1" stop-color="#8a929e"/>
    </linearGradient>
    <linearGradient id="lower-left" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#414956"/>
      <stop offset="0.4" stop-color="#3e4551"/>
      <stop offset="0.8" stop-color="#353c49"/>
      <stop offset="1" stop-color="#303643"/>
    </linearGradient>
    <linearGradient id="lower-right" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#343c4a"/>
      <stop offset="0.5" stop-color="#303744"/>
      <stop offset="1" stop-color="#2b313e"/>
    </linearGradient>
    <linearGradient id="lower-center" x1="0" y1="0" x2="0.08" y2="1">
      <stop offset="0" stop-color="#c9cdd3"/>
      <stop offset="0.06" stop-color="#b0b5be"/>
      <stop offset="0.21" stop-color="#9a9faa"/>
      <stop offset="0.48" stop-color="#8d94a0"/>
      <stop offset="0.76" stop-color="#7a8291"/>
      <stop offset="1" stop-color="#697383"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6eaf0" stop-opacity="0.53"/>
      <stop offset="0.35" stop-color="#d3dae2" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#161e2b" stop-opacity="0.30"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#clip-diamond)">
    <!-- The two deeper side facets -->
    <path d="M255 517 H626 V947 H255 Z" fill="url(#lower-left)"/>
    <path d="M626 517 H999 V947 H626 Z" fill="url(#lower-right)"/>
    <!-- Upper bevels -->
    <path d="M255 333 H549 L470 518 H255 Z" fill="url(#upper-left)"/>
    <path d="M547 333 H705 L783 518 H469 Z" fill="url(#upper-center)"/>
    <path d="M704 333 H999 V518 H782 Z" fill="url(#upper-right)"/>
    <!-- Central elongated lower facet -->
    <path d="M469 518 H783 L624 904 Z" fill="url(#lower-center)"/>
  </g>
  <use href="#gem-outline" fill="none" stroke="url(#rim)" stroke-width="1.25"/>
</svg>
